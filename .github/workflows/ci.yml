name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_tests:
        description: Run slow numerical tests and the six current-default goldens
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CMAKE_GENERATOR: Unix Makefiles
    steps:
      # Full action pins are deliberate dependency identities.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.5"
      - name: Install pinned verification tools
        run: |
          python -m pip install --no-cache-dir \
            cmake==4.2.3 numpy==1.25.2 pybind11==3.0.2 pytest==7.4.1 \
            mypy==1.5.1 ruff==0.16.10 clang-format==18.1.8 \
            build==1.6.1 scikit-build-core==1.1.1
      - name: Run strict checks
        shell: bash
        env:
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all_tests }}
        run: |
          flags=()
          if [[ "$RUN_ALL" == true ]]; then flags+=(--all); fi
          CFDR_PYTHON="$(command -v python)" ./tests/tools/check.sh "${flags[@]}"
